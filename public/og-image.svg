<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#14182b" />
      <stop offset="60%" stop-color="#090b12" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>

    <!-- Cyan/Pink Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a06cd5" />
      <stop offset="100%" stop-color="#ff3562" />
    </linearGradient>

    <!-- Glowing Lightning Filter -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="rgba(0, 242, 254, 0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Outer Glass Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Center Badge -->
  <rect x="475" y="120" width="250" height="42" rx="21" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
  <text x="600" y="147" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="4">BROWSER ARCADE</text>

  <!-- Center Lightning Bolt -->
  <path d="M605 185 L580 235 L598 235 L594 275 L622 225 L602 225 Z" fill="url(#brandGrad)" filter="url(#boltGlow)" />

  <!-- Main Title -->
  <text x="600" y="360" font-family="'Outfit', -apple-system, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">ONE MORE RUSH</text>

  <!-- Tagline -->
  <text x="600" y="420" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" text-anchor="middle">Six skill games. Daily Challenges. One more try.</text>

  <!-- Game Icons Pill Strip -->
  <g transform="translate(600, 485)">
    <rect x="-260" y="-22" width="520" height="44" rx="22" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="0" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="8">🎯  🛡️  🧱  🔢  🧠  🎨</text>
  </g>
</svg>
